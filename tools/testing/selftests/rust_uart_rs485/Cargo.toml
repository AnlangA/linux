[package]
name = "rs485-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "Regression tools for Rust UART and character drivers"

[dependencies]
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true

